<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tl-maths</title>
<!-- scripts/fixtures/make-textlayer.mjs adds the bundled Noto Serif @font-face rules here. -->
<style>
  @page { size: Letter; margin: 0; }
  html, body { margin: 0; }
  body { padding: 0.75in; font: 12pt/1.6 'Noto Serif'; color: #000; }
  math { font-family: 'Noto Serif'; }
  p { margin: 0 0 0.8em; }
</style>
</head>
<body>
<p>A square with side <math><mi>x</mi></math> has an area of <math><msup><mi>x</mi><mn>2</mn></msup></math> square units.</p>
<p>Every point on a circle of radius <math><mi>r</mi></math> satisfies <math><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math> in plane coordinates.</p>
<p>The sequence grows like <math><msup><mn>2</mn><mi>n</mi></msup></math> while the first term <math><msub><mi>a</mi><mn>0</mn></msub></math> stays fixed.</p>
</body>
