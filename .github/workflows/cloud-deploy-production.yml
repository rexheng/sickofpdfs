# Release 2 cloud: deploys a TAGGED release (v*) to the owner's production Worker. First it records a D1 Time Travel restore
# point for every production database (kept 7 days; the bookmarks are in the job summary and kept as an artifact for 30 days)
# and stops if that fails. Then the web library's files (to R2), the schema, the Worker and the smoke test. Run by hand on a
# tag, never on a branch.
# The GitHub environment "production" should require the owner's approval (docs/setup/cloud.md).
name: Deploy cloud (production)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck and tests
        run: |
          pnpm -C apps/cloud typecheck
          pnpm vitest run --project cloud packages/core/src/sync --passWithNoTests

      - name: Restore point (before anything changes)
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/restore-point.mjs --env production --out restore-point.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-point-${{ github.ref_name }}
          path: apps/cloud/restore-point.json
          retention-days: 30

      - name: Build the web library
        run: pnpm -C apps/cloud build:web

      # The web library's files go to the R2 bucket sop-web (Workers static assets cannot be uploaded on this account), then
      # the schema, the Worker and the smoke test. Secrets are left as they are. See apps/cloud/scripts/deploy-production.mjs.
      - name: Files, schema, the Worker and the smoke test
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/env-info.mjs --env production ready
          node scripts/deploy-production.mjs --skip-build --skip-restore-point --skip-secrets
