# The Release 1 build: pushing a tag like v1.0.0 makes a DRAFT GitHub release with the extension zip attached.
# Nothing is published until the owner opens the draft on GitHub and presses Publish.
#
# The tag must match the version in apps/extension/package.json (tag v1.0.0 = version 1.0.0).
# Gates here: typecheck, lint, unit tests (the long walkthrough suite is not run here), the production build with its own
# checks, and scripts/release/verify-zip.mjs on the zip that is attached.
#
# Security: the only permission is contents: write (to create the release). The only credential is the built-in GITHUB_TOKEN,
# given to the one step that creates the release. No other secret is used. The extension's private key is NOT needed (an
# unpacked extension takes its id from the public key committed in the repo) and must never be added here. Actions are pinned
# to full commit SHAs. The tag name reaches the shell only as an environment variable.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match apps/extension/package.json version $version" >&2
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # test-assets/ (the real PDFs) is not in git, so three test files that read it are skipped here (vitest.config.ts).
      - name: Unit tests
        env:
          SOP_NO_FIXTURES: '1'
        run: pnpm test

      - name: Licence list is current
        run: node scripts/release/notices.mjs --check

      - name: Build and verify the zip
        run: pnpm release:zip --out "$RUNNER_TEMP/release"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/release/sickofpdfs-*.zip \
            --draft --verify-tag --title "sickofpdfs $TAG" \
            --notes "Download the zip, unzip it into one folder, then in Chrome open chrome://extensions, turn on Developer mode and press Load unpacked. Updating keeps your notes: see HOW-TO-UPDATE.txt inside the zip."
