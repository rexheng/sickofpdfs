# Release 2 cloud: typecheck, lint and the Worker's tests (on workerd, under Miniflare). No secrets, nothing on Cloudflare.
# Runs by hand for now (plan CL8: every workflow starts as workflow_dispatch only). Actions are pinned to full commit SHAs.
name: Cloud CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm -C apps/cloud typecheck

      - name: Lint
        run: node node_modules/eslint/bin/eslint.js apps/cloud packages/core/src/sync

      - name: Tests (sync rules and the Worker)
        run: pnpm vitest run --project cloud packages/core/src/sync --passWithNoTests

      - name: The local Worker starts and has its schema
        run: pnpm -C apps/cloud dev:test --check
