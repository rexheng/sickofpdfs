# Release 2 cloud: deploys the current branch to the STAGING Worker (its own databases and its own GitHub sign-in app), then
# runs the smoke test. Build agents use this; it can never touch production. By hand only for now.
name: Deploy cloud (staging)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm -C apps/cloud typecheck

      - name: Schema, then the Worker
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/env-info.mjs --env staging ready
          for db in META TEXT_0; do echo y | node node_modules/wrangler/bin/wrangler.js d1 migrations apply $db --remote --env staging; done
          node node_modules/wrangler/bin/wrangler.js deploy --env staging

      - name: Smoke test
        working-directory: apps/cloud
        run: node scripts/smoke.mjs --url "$(node scripts/env-info.mjs --env staging url)"
