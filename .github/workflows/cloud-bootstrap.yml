# Release 2 cloud: creates one environment on the owner's Cloudflare account (databases, bucket, key-value namespace, Worker,
# secrets), then commits the new ids in apps/cloud/wrangler.jsonc. Run it once per environment, by hand, only after the owner's
# OK (plan Round 6: OK #1 is staging, OK #2 is production). Safe to run again: it reuses what exists.
# Secrets: see docs/setup/cloud.md. Each one is given only to the step that needs it.
name: Bootstrap cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which one to create'
        required: true
        type: choice
        options: [staging, production]
      dry_run:
        description: 'Only print what would happen'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cloud-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bootstrap
        working-directory: apps/cloud
        env:
          ENV_NAME: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_GITHUB_ID: ${{ secrets.ALLOWED_GITHUB_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ inputs.environment == 'production' && secrets.GH_OAUTH_PRODUCTION_CLIENT_ID || secrets.GH_OAUTH_STAGING_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ inputs.environment == 'production' && secrets.GH_OAUTH_PRODUCTION_CLIENT_SECRET || secrets.GH_OAUTH_STAGING_CLIENT_SECRET }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/bootstrap.mjs --env "$ENV_NAME" --dry-run; else node scripts/bootstrap.mjs --env "$ENV_NAME"; fi

      - name: Commit the ids
        if: ${{ !inputs.dry_run }}
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud/wrangler.jsonc
          git diff --cached --quiet || git commit -m "chore(cloud): ids for $ENV_NAME from bootstrap"
          git push
